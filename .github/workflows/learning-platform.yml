name: Verify learning platform
on:
  pull_request:
    paths:
      - 'learning-platform/**'
      - '.github/workflows/learning-platform.yml'
      - '.devcontainer/learning-platform/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-platform
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-platform/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, fileinfo, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-interaction
      - run: composer audit --no-interaction
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:php
      - run: npm test
      - run: npm run test:extensions
      - run: npm run test:trial
      - run: npm run test:preview
      - run: npm run build:preview
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tafaseel-learning-hostinger
          path: learning-platform/output/tafaseel-learning-hostinger.zip
          retention-days: 14

  trial-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the actual Codespaces runtime
        run: docker build -t tafaseel-github-trial .devcontainer/learning-platform
      - name: Verify installation and start a private trial runtime
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CODESPACES=true -e CODESPACE_NAME=tafaseel-ci-test -e GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=app.github.dev -v "$PWD:/workspace" -w /workspace/learning-platform tafaseel-github-trial sh -lc '
            composer install --no-dev --prefer-dist --no-interaction &&
            npm ci && npm run build &&
            php server/codespaces-init.php init &&
            npm run trial:start &&
            curl --fail --silent "http://127.0.0.1:8080/api/index.php?action=health" &&
            npm run test:trial
          '
